# Läuft im öffentlichen Repository luigibaumigi/schoenes-wetter-daten (dort unter .github/workflows/).
# Quelle ist pipeline/ im App-Repository; übertragen mit pipeline/uebertragen.sh.
name: Daten-Job

on:
  schedule:
    # Jede Stunde um :52: Ein Lauf von ICON-D2-RUC ist rund 47 Minuten nach dem Start bis +8 h vollständig.
    # Dazu :22 als Reserve, weil GitHub geplante Läufe gelegentlich auslässt (er liefert dann denselben Lauf noch einmal).
    - cron: "22,52 * * * *"
  workflow_dispatch:
    inputs:
      stoerung_probe:
        description: "Absichtlich scheitern lassen (prüft die Störungsmeldung)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write  # nur für das Lebenszeichen alle 40 Tage
  pages: write
  id-token: write
  issues: write

concurrency:
  group: daten-job
  cancel-in-progress: false

jobs:
  daten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.veroeffentlichen.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Probe-Störung
        if: ${{ inputs.stoerung_probe }}
        run: |
          echo "Absichtlicher Fehlschlag, um die Störungsmeldung zu prüfen."
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Bibliotheken
        run: pip install -r requirements.txt

      - name: Wolken und Wind berechnen
        run: |
          python daten_job.py --ausgabe seite
          cp startseite.html seite/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: seite
          retention-days: 1

      - name: Veröffentlichen
        id: veroeffentlichen
        uses: actions/deploy-pages@v5

      - name: Lebenszeichen
        # GitHub schaltet geplante Läufe in öffentlichen Repositories nach 60 Tagen ohne Commit ab.
        run: |
          alter=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$alter" -gt $((40 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Lebenszeichen, damit der Zeitplan aktiv bleibt"
            git push
          fi

      - name: Störung melden
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create stoerung --color B60205 --description "Daten-Job gescheitert" 2>/dev/null || true
          offen=$(gh issue list --label stoerung --state open --json number --jq '.[0].number // empty')
          lauf="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "$offen" ]; then
            gh issue create --label stoerung --assignee "${{ github.repository_owner }}" --title "Daten-Job gestört" --body "@${{ github.repository_owner }} Der Daten-Job ist gescheitert: $lauf

          Die App zeigt bis zur Behebung die zuletzt veröffentlichten Wolken und Wind, bis sie zu alt sind.
          Dieses Thema schließt sich von selbst, sobald ein Lauf wieder klappt. Weitere Fehlschläge melden sich hier nicht erneut."
          fi

      - name: Störung aufheben
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for nr in $(gh issue list --label stoerung --state open --json number --jq '.[].number'); do
            gh issue close "$nr" --comment "Läuft wieder: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
